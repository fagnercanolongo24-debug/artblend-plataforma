<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🔐 ArtBlend - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        .login-box h1 { text-align: center; color: #667eea; margin-bottom: 30px; font-size: 2em; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1em; }
        .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 5px rgba(102,126,234,0.3); }
        .btn { width: 100%; background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1em; margin-top: 10px; }
        .btn:hover { transform: scale(1.02); }
        .error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 5px; margin-bottom: 20px; display: none; }
        .loading { display: none; text-align: center; color: #667eea; }
        .spinner { display: inline-block; border: 3px solid #f3f3f3; border-top: 3px solid #667eea; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .info { text-align: center; color: #999; margin-top: 20px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🎯 ArtBlend</h1>
        <div class="error" id="error"></div>
        <div class="loading" id="loading"><span class="spinner"></span>Autenticando...</div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" placeholder="sua senha" required>
            </div>
            <button type="submit" class="btn">Entrar</button>
        </form>

        <div class="info">
            <strong>Acesso de Teste:</strong><br>
            Use qualquer email/senha
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zjvjixiuvnpbpsdnxuyk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2aml4aXV2bnBicHNkbnh1eWsiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcxMDc0NjI5MSwiZXhwIjoxODM2MjIyMjkxfQ.L4e3B5F6XyZ9KmN2QpR8VwX5YaB3CdE7FgH9IjK0LmN';

        // 1. Limpar cache AGRESSIVAMENTE
        localStorage.clear();
        sessionStorage.clear();
        if ('caches' in window) caches.keys().then(n => n.forEach(x => caches.delete(x)));

        // 2. Se JÁ está logado, redirecionar IMEDIATAMENTE
        window.addEventListener('load', () => {
            const clienteId = localStorage.getItem('cliente_id');
            if (clienteId) {
                console.log('✅ Já autenticado, redirecionando para HUB...');
                window.location.href = '/artblend_hub';
                return;
            }
        });

        // 3. Form de login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');

            errorDiv.style.display = 'none';
            loadingDiv.style.display = 'block';

            try {
                // Buscar cliente na tabela
                const resp = await fetch(
                    `${SUPABASE_URL}/rest/v1/clientes?email=eq.${encodeURIComponent(email)}&select=*&t=${Date.now()}`,
                    { method: 'GET', cache: 'no-store', headers: { 'apikey': SUPABASE_KEY } }
                );

                const clientes = await resp.json();

                if (Array.isArray(clientes) && clientes.length > 0) {
                    // Cliente encontrado
                    const cliente = clientes[0];
                    localStorage.setItem('cliente_id', cliente.id);
                    localStorage.setItem('user_email', cliente.email);
                    localStorage.setItem('user_nome', cliente.nome || 'Usuário');
                    
                    console.log('✅ Login bem-sucedido:', cliente.id);
                    setTimeout(() => window.location.href = '/artblend_hub', 300);
                } else {
                    // Criar novo cliente
                    const novoId = 'cliente_' + Date.now();
                    localStorage.setItem('cliente_id', novoId);
                    localStorage.setItem('user_email', email);
                    localStorage.setItem('user_nome', 'Usuário');
                    
                    console.log('✅ Novo cliente:', novoId);
                    setTimeout(() => window.location.href = '/artblend_hub', 300);
                }
            } catch (err) {
                console.error('❌ Erro:', err);
                errorDiv.textContent = '❌ Erro na autenticação. Tente novamente.';
                errorDiv.style.display = 'block';
                loadingDiv.style.display = 'none';
            }
        });
    </script>
</body>
</html>
