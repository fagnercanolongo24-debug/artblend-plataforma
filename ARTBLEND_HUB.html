<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🎯 ArtBlend Hub - Plataforma v5.0-FINAL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 40px 20px; border-radius: 10px; text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .user-box { background: rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 20px; display: inline-block; margin-top: 15px; }
        .user-box button { background: rgba(255,255,255,0.3); border: none; color: white; padding: 8px 15px; border-radius: 15px; cursor: pointer; margin-left: 10px; transition: all 0.3s; }
        .user-box button:hover { background: rgba(255,255,255,0.5); }
        .status { padding: 15px; margin-bottom: 20px; border-radius: 5px; font-size: 1.1em; border-left: 4px solid; }
        .status.loading { background: #e3f2fd; color: #1976D2; border-color: #1976D2; }
        .status.success { background: #e8f5e9; color: #2e7d32; border-color: #4CAF50; }
        .status.error { background: #ffebee; color: #c62828; border-color: #f44336; }
        .modules { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .module { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-left: 5px solid #667eea; transition: all 0.3s; cursor: pointer; }
        .module:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); border-left-color: #764ba2; }
        .module-icon { font-size: 3em; margin-bottom: 15px; }
        .module-title { font-size: 1.3em; font-weight: bold; margin-bottom: 10px; color: #333; }
        .module-desc { font-size: 0.95em; color: #666; margin-bottom: 15px; line-height: 1.5; }
        .module-btn { width: 100%; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .module-btn:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 768px) { .modules { grid-template-columns: 1fr; } .header h1 { font-size: 1.8em; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 ArtBlend Hub</h1>
            <p>Plataforma Inteligente de Consultoria para Restaurantes</p>
            <div class="user-box">
                <span id="userEmail">Carregando...</span>
                <button onclick="logout()">Sair</button>
            </div>
        </div>

        <div id="statusArea"></div>
        <div id="modulesArea"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zjvjixiuvnpbpsdnxuyk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2aml4aXV2bnBicHNkbnh1eWsiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcxMDc0NjI5MSwiZXhwIjoxODM2MjIyMjkxfQ.L4e3B5F6XyZ9KmN2QpR8VwX5YaB3CdE7FgH9IjK0LmN';

        const MODULOS_PADRAO = [
            { nome: 'Dashboard Consultor Completo', icon: '📊', desc: 'Visão 360° do seu negócio com gráficos e KPIs em tempo real', arquivo: 'ARTBLEND_DASHBOARD_CONSULTOR_COMPLETO.html' },
            { nome: 'Gamificação Sistema Completa', icon: '🎮', desc: '30 badges, pontos, ranking e motivação para sua equipe', arquivo: 'ARTBLEND_GAMIFICACAO_SISTEMA_COMPLETA.html' },
            { nome: 'WhatsApp Automação Completa', icon: '💬', desc: '6 templates de mensagem automática com triggers inteligentes', arquivo: 'ARTBLEND_WHATSAPP_AUTOMACAO_COMPLETA.html' },
            { nome: 'Dashboard Clientes Realtime', icon: '🌐', desc: 'Status online, heatmap 24h, funnel de conversão em tempo real', arquivo: 'ARTBLEND_DASHBOARD_CLIENTES_REALTIME.html' },
            { nome: 'Temas Personalização Completa', icon: '🎨', desc: 'Dark Mode, cores customizadas, múltiplos temas profissionais', arquivo: 'ARTBLEND_TEMAS_PERSONALIZACAO_COMPLETA.html' },
            { nome: 'Notificações Sistema Completa', icon: '🔔', desc: '4 tipos de notificações, bell icon, alertas em tempo real', arquivo: 'ARTBLEND_NOTIFICACOES_SISTEMA_COMPLETA.html' },
            { nome: 'Relatório Cliente V2 Final', icon: '📄', desc: 'KPIs, progresso do cliente, recomendações personalizadas', arquivo: 'ARTBLEND_RELATORIO_CLIENTE_V2_FINAL.html' },
            { nome: 'Analytics BI Dashboard Completo', icon: '📈', desc: 'Receita, funnel, ROI, cursos mais populares, análise profunda', arquivo: 'ARTBLEND_ANALYTICS_BI_DASHBOARD_COMPLETO.html' }
        ];

        localStorage.clear();
        sessionStorage.clear();
        if ('caches' in window) caches.keys().then(n => n.forEach(x => caches.delete(x)));

        function log(m) { console.log('🎯 [ARTBLEND v5.0-FINAL] ' + m); }
        function status(t, m) { document.getElementById('statusArea').innerHTML = '<div class="status ' + (t === 'erro' ? 'error' : t === 'ok' ? 'success' : 'loading') + '">' + m + '</div>'; }
        function getClienteId() { const id = localStorage.getItem('cliente_id'); if (id) document.getElementById('userEmail').textContent = localStorage.getItem('user_email') || 'Usuário'; return id; }
        function logout() { localStorage.clear(); window.location.href = '/'; }
        function abrirModulo(a) { window.location.href = '/' + a; }

        async function carregarModulos() {
            const id = getClienteId();
            if (!id) { status('erro', '❌ Erro: Login necessário'); setTimeout(() => window.location.href = '/', 2000); return; }
            status('loading', '⏳ Carregando módulos...<div class="spinner"></div>');
            try {
                const r = await fetch(`${SUPABASE_URL}/rest/v1/dados_ferramenta?cliente_id=eq.${id}&select=*&t=${Date.now()}`, { method: 'GET', cache: 'no-store', headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Cache-Control': 'no-cache, no-store, must-revalidate' } });
                if (r.ok) { const m = await r.json(); renderizar(m.length > 0 ? m : MODULOS_PADRAO); } else { renderizar(MODULOS_PADRAO); }
            } catch (e) { log('ERRO: ' + e.message); renderizar(MODULOS_PADRAO); }
        }

        function renderizar(m) {
            status('ok', '✅ ' + m.length + ' módulos carregados!');
            document.getElementById('modulesArea').innerHTML = '<div class="modules">' + m.map(x => `<div class="module" onclick="abrirModulo('${x.arquivo || '#'}')"><div class="module-icon">${x.icon || '📦'}</div><div class="module-title">${x.nome || 'Módulo'}</div><div class="module-desc">${x.desc || x.descricao || 'Módulo'}</div><button class="module-btn" onclick="abrirModulo('${x.arquivo || '#'}'); event.stopPropagation();">▶️ Abrir</button></div>`).join('') + '</div>';
        }

        document.addEventListener('DOMContentLoaded', carregarModulos);
    </script>
</body>
</html>
