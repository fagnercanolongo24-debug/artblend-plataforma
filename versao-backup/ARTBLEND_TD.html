<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T&amp;D — Treinamento &amp; Desenvolvimento · ArtBlend</title>
<style>
  :root{
    --bg:#F5F7FA; --sidebar:#FFFFFF; --card:#FFFFFF; --card-hover:#EEF6F8; --border:#E2E6ED;
    --text:#16294A; --muted:#6E7A8C; --accent:#2EC4D6; --accent-soft:#E4F8FB;
    --good:#2ECC71; --good-bg:#E3FBEF; --bad:#B3411F; --bad-bg:#FBEAE3; --amber:#9a5420; --amber-bg:#FDF3E0;
    --blue:#1C93A8;
    --caso:#1C93A8; --caso-bg:#E4F8FB; --script:#2F5D8C; --script-bg:#E8EFF6;
    --template:#9a5420; --template-bg:#FDF3E0; --exerc:#6B4E9E; --exerc-bg:#EFEAF6;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh;}
  .sidebar{width:250px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{font-size:19px;font-weight:800;letter-spacing:-.4px;color:var(--text);}
  .brand small{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-top:2px;font-weight:700;}
  .client-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;margin:14px 0;}
  .client-box label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px;}
  .client-box select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12px;}
  .client-box .add-client{margin-top:6px;display:flex;gap:5px;}
  .client-box .add-client input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 7px;font-size:11.5px;}
  .client-box .add-client button{background:var(--accent);border:none;color:#fff;border-radius:6px;padding:0 9px;font-weight:700;cursor:pointer;font-size:13px;}
  .navitem{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;cursor:pointer;margin-top:4px;font-weight:600;font-size:13.5px;color:var(--text);}
  .navitem:hover{background:var(--card-hover);}
  .navitem.active{background:var(--accent);color:#fff;}
  .navfoot{margin-top:16px;padding-top:12px;border-top:1px solid var(--border);}
  .navfoot button{width:100%;background:var(--card-hover);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:11.5px;font-weight:700;cursor:pointer;margin-top:5px;}
  .navfoot button:hover{border-color:var(--accent);}
  .main{flex:1;padding:26px 34px 60px;max-width:960px;}
  h1{font-size:23px;margin:0;font-weight:800;color:var(--text);}
  .sub{color:var(--muted);font-size:13.5px;margin:4px 0 18px;line-height:1.5;}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  select,input,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:var(--text);}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .panel h3{margin:0 0 12px;font-size:15px;color:var(--text);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:var(--accent-soft);color:var(--blue);text-align:left;padding:8px 9px;font-weight:700;font-size:12px;}
  td{border-bottom:1px solid var(--border);padding:7px 9px;vertical-align:middle;}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;}
  .btn.alt{background:var(--blue);} .btn.sm{padding:6px 11px;font-size:12px;}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
  .btn.ghost:hover{border-color:var(--accent);color:var(--blue);}
  .del{background:transparent;border:1px solid var(--bad);color:var(--bad);border-radius:7px;padding:4px 8px;font-size:12px;cursor:pointer;font-weight:700;}
  .formgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .formgrid label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
  .formgrid input,.formgrid textarea,.formgrid select{width:100%;}
  label.block{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:10px 0 4px;}
  .hint{font-size:12px;color:var(--muted);font-style:italic;}
  .save{position:fixed;bottom:14px;right:16px;background:var(--text);color:#fff;padding:7px 14px;border-radius:30px;font-size:12px;opacity:0;transition:.3s;}
  .save.on{opacity:1;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px 16px;}
  .card .v{font-size:22px;font-weight:800;color:var(--text);} .card .l{font-size:11.5px;color:var(--muted);font-weight:600;}
  .radiorow{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap;}
  .radiorow label{text-transform:none;font-weight:600;font-size:13px;color:var(--text);display:flex;align-items:center;gap:5px;}
  .chip{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;}
  .chip.sabe{background:var(--bad-bg);color:var(--bad);} .chip.consegue{background:var(--amber-bg);color:var(--amber);} .chip.quer{background:var(--accent-soft);color:var(--blue);}
  /* curso */
  .curso-wrap{max-width:860px;}
  h2.mh{font-size:19px;color:var(--text);margin:26px 0 4px;font-weight:800;}
  h2.mh:first-child{margin-top:0;}
  .m-kick{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);font-weight:700;}
  h3.ch{font-size:16px;color:var(--text);margin:18px 0 6px;font-weight:750;border-left:4px solid var(--accent);padding-left:10px;}
  .cbox{border-radius:10px;padding:14px 17px;margin:12px 0;border:1px solid var(--border);}
  .cbox .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:20px;color:#fff;margin-bottom:8px;}
  .cbox.caso{background:var(--caso-bg);} .cbox.caso .tag{background:var(--caso);}
  .cbox.script{background:var(--script-bg);} .cbox.script .tag{background:var(--script);}
  .cbox.template{background:var(--template-bg);} .cbox.template .tag{background:var(--template);}
  .cbox.warn{background:var(--bad-bg);} .cbox.warn .tag{background:var(--bad);}
  .metodo{background:linear-gradient(135deg,var(--text),var(--blue));color:#EAF6F3;border-radius:12px;padding:18px 20px;margin:16px 0;}
  .metodo .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;background:var(--accent);color:#fff;padding:4px 12px;border-radius:20px;margin-bottom:10px;}
  .metodo h4{color:#fff;margin:0 0 8px;font-size:16px;} .metodo strong{color:#BFF3EE;}
  .say{background:#fff;border-left:4px solid var(--script);border-radius:6px;padding:9px 13px;margin:8px 0;font-style:italic;font-size:13px;}
  .chain{text-align:center;font-weight:800;color:var(--blue);background:var(--accent-soft);border-radius:10px;padding:12px;margin:14px 0;font-size:13.5px;}
  .note{font-size:12.5px;color:var(--muted);font-style:italic;}
  .lead{font-size:15px;color:var(--muted);}
  pre.form{background:var(--bg);border:1px dashed var(--template);border-radius:8px;padding:14px 16px;font-family:Consolas,Menlo,monospace;white-space:pre-wrap;font-size:12px;line-height:1.5;color:var(--text);margin:10px 0 0;}
  @media(max-width:780px){
    body{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-right:0;border-bottom:1px solid var(--border);padding:12px 14px;overflow-y:visible;}
    .sidebar .brand{width:100%;}
    .sidebar .client-box{flex:1 1 220px;margin:0;}
    .sidebar .navitem{margin-top:0;}
    .sidebar .navfoot{width:100%;display:flex;flex-wrap:wrap;gap:6px;border-top:0;margin-top:6px;padding-top:6px;}
    .sidebar .navfoot button{width:auto;flex:1 1 auto;margin-top:0;}
    .formgrid{grid-template-columns:1fr;}
    .main{padding:16px;}
  }
  #loginGate{position:fixed;inset:0;background:#F5F7FA;z-index:1000;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #loginGate .box{background:#fff;border:1px solid #E2E6ED;border-radius:14px;padding:32px 30px;max-width:360px;width:92%;}
  #loginGate h1{font-size:18px;color:#16294A;margin-bottom:4px;}
  #loginGate p{font-size:12.5px;color:#6E7A8C;margin-bottom:18px;line-height:1.5;}
  #loginGate label{display:block;font-size:11.5px;font-weight:700;color:#6E7A8C;margin:10px 0 4px;}
  #loginGate input{width:100%;padding:9px 10px;border:1px solid #E2E6ED;border-radius:8px;font-size:13.5px;font-family:inherit;}
  #loginGate .row{display:flex;gap:8px;margin-top:16px;}
  #loginGate button{flex:1;background:#2EC4D6;color:#08343B;border:none;padding:10px;border-radius:8px;font-weight:700;font-size:12.5px;cursor:pointer;}
  #loginGate button.sec{background:#E4F8FB;color:#1C93A8;}
  #loginGate .msg{margin-top:12px;font-size:12px;padding:8px 10px;border-radius:7px;line-height:1.5;display:none;}
  #loginGate .msg.ok{background:#E3FBEF;color:#1C9A57;display:block;}
  #loginGate .msg.err{background:#FBEAE3;color:#B3411F;display:block;}
  #userBar{position:fixed;top:10px;right:10px;z-index:900;background:#fff;border:1px solid #E2E6ED;font-size:11.5px;font-weight:700;color:#16294A;padding:6px 8px 6px 12px;border-radius:20px;display:none;align-items:center;gap:8px;}
  #userBar button{background:#FBEAE3;color:#B3411F;border:none;padding:5px 10px;border-radius:14px;font-size:10.5px;font-weight:700;cursor:pointer;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.5"></script>
</head>
<body>

<div id="loginGate">
  <div class="box">
    <h1>ArtBlend — Área do consultor</h1>
    <p>Entre com seu login para acessar esta ferramenta.</p>
    <label>E-mail</label>
    <input id="lg_email" type="email" placeholder="seu@email.com">
    <label>Senha</label>
    <input id="lg_senha" type="password" placeholder="mínimo 6 caracteres">
    <div class="row">
      <button onclick="gateEntrar()">Entrar</button>
      <button class="sec" onclick="gateCadastrar()">Criar conta</button>
    </div>
    <div id="lg_msg" class="msg"></div>
  </div>
</div>
<div id="userBar"><span id="userBarEmail"></span><button onclick="gateSair()">Sair</button></div>

<div id="appContent" style="display:none;">
<div class="sidebar">
  <div class="brand">ArtBlend<small>T&amp;D</small></div>
  <div class="client-box">
    <label>Cliente / Projeto ativo</label>
    <select id="clientSelect" onchange="switchClient(this.value)"></select>
    <div class="add-client">
      <input type="text" id="newClientName" placeholder="Novo cliente...">
      <button onclick="addClient()">+</button>
    </div>
  </div>
  <div class="navitem active" data-s="curso">🎓 Curso T&amp;D</div>
  <div class="navitem" data-s="lnt">🔍 LNT — Diagnóstico</div>
  <div class="navitem" data-s="plano">📋 Plano de Treinamento</div>
  <div class="navitem" data-s="aval">📊 Avaliação (4 níveis)</div>
  <div class="navitem" data-s="caso">🧩 Exercício — Caso Simulado</div>
  <div class="navitem" data-s="guia">📖 Como usar</div>
  <div class="navfoot">
    <button onclick="exportJSON()">⬇ Exportar dados</button>
    <button onclick="document.getElementById('fileIn').click()">⬆ Importar dados</button>
    <button onclick="window.print()">🖨 Imprimir</button>
  </div>
</div>
<main class="main" id="main"></main>
<div class="save" id="save">✓ salvo</div>
<input type="file" id="fileIn" accept="application/json" style="display:none">
</div>

<script>
/* ===== login / sessão ===== */
const FERRAMENTA = 'td';
const sb = window.supabase.createClient('https://zjvjixiuvnpbpsdnxuyk.supabase.co', 'sb_publishable_f5DJRgs2w0z3_g50QqDmNQ_0btPNSgV');
let sessaoAtual = null;

function gateMsg(text, type){
  var el = document.getElementById('lg_msg');
  el.className = 'msg ' + type;
  el.textContent = text;
}
async function gateEntrar(){
  var email = document.getElementById('lg_email').value.trim();
  var senha = document.getElementById('lg_senha').value;
  var r = await sb.auth.signInWithPassword({ email: email, password: senha });
  if(r.error){ gateMsg('Erro ao entrar: ' + r.error.message, 'err'); return; }
  await iniciarApp(r.data.session);
}
async function gateCadastrar(){
  var email = document.getElementById('lg_email').value.trim();
  var senha = document.getElementById('lg_senha').value;
  if(!email || senha.length < 6){ gateMsg('Preencha e-mail e uma senha com pelo menos 6 caracteres.', 'err'); return; }
  var r = await sb.auth.signUp({ email: email, password: senha });
  if(r.error){ gateMsg('Erro ao criar conta: ' + r.error.message, 'err'); return; }
  if(r.data.session){ await iniciarApp(r.data.session); }
  else { gateMsg('Conta criada. Se pedir confirmação por e-mail, confira sua caixa de entrada antes de entrar.', 'ok'); }
}
async function gateSair(){
  await sb.auth.signOut();
  location.reload();
}
async function iniciarApp(session){
  sessaoAtual = session;
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('appContent').style.display = 'flex';
  var bar = document.getElementById('userBar');
  bar.style.display = 'flex';
  document.getElementById('userBarEmail').textContent = session.user.email;
  await loadClients();
  S = await load();
  render('curso');
}

/* ===== multi-cliente (Supabase) ===== */
let clients = []; // [{id, nome}]
let activeClient = ''; // id do cliente ativo
async function loadClients(){
  var r = await sb.from('clientes').select('id,nome').order('created_at', { ascending:true });
  if(r.error){
    alert('Erro ao carregar a lista de clientes — não prossiga até resolver, ou você pode sobrescrever dados salvos.\n' + r.error.message);
    return;
  }
  clients = (r.data || []).map(function(c){ return { id:c.id, nome:c.nome }; });
  if(clients.length === 0){
    var ins = await sb.from('clientes').insert({ nome:'Cliente padrão', owner_id: sessaoAtual.user.id }).select('id,nome');
    if(ins.error){ alert('Erro ao criar cliente padrão: ' + ins.error.message); return; }
    if(ins.data && ins.data[0]) clients = [{ id: ins.data[0].id, nome: ins.data[0].nome }];
  }
  if(clients.length === 0) return;
  var lembrado = localStorage.getItem('artblend_td_v1__active_id');
  activeClient = (lembrado && clients.some(function(c){return c.id===lembrado;})) ? lembrado : clients[0].id;
  renderClientSelect();
}
function renderClientSelect(){
  var sel = document.getElementById('clientSelect');
  sel.innerHTML = clients.map(function(c){ return '<option value="'+c.id+'"'+(c.id===activeClient?' selected':'')+'>'+esc(c.nome)+'</option>'; }).join('');
}
async function addClient(){
  var input = document.getElementById('newClientName');
  var nome = input.value.trim();
  if(!nome) return;
  var ins = await sb.from('clientes').insert({ nome:nome, owner_id: sessaoAtual.user.id }).select('id,nome');
  if(ins.error){ alert('Erro ao criar cliente: ' + ins.error.message); return; }
  clients.push({ id: ins.data[0].id, nome: ins.data[0].nome });
  input.value = '';
  await switchClient(ins.data[0].id);
}
async function switchClient(id){
  activeClient = id;
  localStorage.setItem('artblend_td_v1__active_id', id);
  renderClientSelect();
  S = await load();
  render(cur);
  toast();
}

function seedCasoSim(){return {prior1:'',prior2:'',prior3:'',causa:'',plano2sem:'',dadosAdicionais:'',gabaritoAberto:false};}
function seed(){return {
  lnt:{fat:'',ticket:'',cmv:'',google:'',turnover:'',reclamacao:'',obsInicio:'',obsFim:'',obsBem:'',obsErrado:'',obsLideranca:'',escutaEquipe:'',escutaDono:'',causa:'',prior1:'',prior2:'',prior3:''},
  planos:[],
  avaliacoes:[],
  casoSim: seedCasoSim()
};}
var S;
var loadFailed = false; // true quando a última leitura do Supabase falhou — bloqueia save() pra não gravar seed() vazio por cima de dado real
async function load(){
  var r = await sb.from('dados_ferramenta').select('conteudo').eq('cliente_id', activeClient).eq('ferramenta', FERRAMENTA).maybeSingle();
  if(r.error){
    loadFailed = true;
    alert('Erro ao carregar dados do cliente — o salvamento automático foi bloqueado até você recarregar a página com sucesso, pra não sobrescrever dados salvos.\n' + r.error.message);
    return seed();
  }
  loadFailed = false;
  if(r.data && r.data.conteudo) return r.data.conteudo;
  return seed();
}
async function doSave(){
  if(loadFailed){ alert('Não é possível salvar agora: o último carregamento de dados falhou. Recarregue a página antes de continuar editando, para não perder dados salvos.'); return; }
  try{
    var r = await sb.from('dados_ferramenta').upsert({ cliente_id: activeClient, ferramenta: FERRAMENTA, conteudo: S, updated_at: new Date().toISOString() }, { onConflict: 'cliente_id,ferramenta' });
    if(r.error){ alert('Não foi possível salvar: ' + r.error.message); return; }
    toast();
  }catch(e){ alert('Não foi possível salvar: ' + e.message); }
}
var _saveTimer = null;
function save(){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(doSave, 600);
}
function toast(){var b=document.getElementById('save');b.classList.add('on');clearTimeout(window._t);window._t=setTimeout(function(){b.classList.remove('on');},900);}
function esc(s){return (s==null?'':String(s)).replace(/"/g,'&quot;');}
function uid(){return Date.now()+''+Math.floor(Math.random()*999);}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}

/* nav */
document.querySelectorAll('.navitem').forEach(function(n){n.onclick=function(){
 document.querySelectorAll('.navitem').forEach(function(x){x.classList.remove('active');});
 n.classList.add('active'); render(n.dataset.s);};});
var cur='curso';
function render(s){cur=s||cur; var m=document.getElementById('main');
 if(cur=='curso')m.innerHTML=vCurso();
 else if(cur=='lnt')m.innerHTML=vLnt();
 else if(cur=='plano')m.innerHTML=vPlano();
 else if(cur=='aval')m.innerHTML=vAval();
 else if(cur=='caso')m.innerHTML=vCasoSim();
 else m.innerHTML=vGuia();
}

/* ===== LNT ===== */
function vLnt(){var l=S.lnt;
 function fi(k,label,ph){return '<div><label>'+label+'</label><input value="'+esc(l[k])+'" placeholder="'+(ph||'')+'" oninput="setLnt(\''+k+'\',this.value)"></div>';}
 function ta(k,label,ph){return '<div style="grid-column:1/-1"><label>'+label+'</label><textarea rows="2" placeholder="'+(ph||'')+'" oninput="setLnt(\''+k+'\',this.value)">'+esc(l[k])+'</textarea></div>';}
 var causaChip = l.causa=='sabe'?'<span class="chip sabe">Não sabe → treino de conhecimento</span>':l.causa=='consegue'?'<span class="chip consegue">Não consegue → treino de habilidade + prática</span>':l.causa=='quer'?'<span class="chip quer">Não quer → isso é liderança, não T&D</span>':'';
 return '<h1>LNT — Levantamento de Necessidades de Treinamento</h1><p class="sub">O diagnóstico antes de qualquer treino. Sem ele, você treina no escuro.</p>'+
 '<div class="panel"><h3>1. Dados</h3><div class="formgrid">'+
  fi('fat','Faturamento (R$)','Ex: 90000')+fi('ticket','Ticket médio (R$)','Ex: 32')+fi('cmv','CMV (%)','Ex: 34')+
  fi('google','Nota Google','Ex: 4.2')+fi('turnover','Turnover mensal (%)','Ex: 9')+fi('reclamacao','Principal reclamação','Ex: atendimento lento')+
 '</div></div>'+
 '<div class="panel"><h3>2. Observação (pico, sem intervir)</h3><div class="formgrid">'+
  fi('obsInicio','Horário início','Ex: 19h')+fi('obsFim','Horário fim','Ex: 21h')+'<div></div>'+
  ta('obsBem','O que funciona bem')+ta('obsErrado','O que está errado')+ta('obsLideranca','Comportamento da liderança')+
 '</div></div>'+
 '<div class="panel"><h3>3. Escuta</h3><div class="formgrid">'+
  ta('escutaEquipe','O que a equipe diz')+ta('escutaDono','O que o dono diz')+
 '</div></div>'+
 '<div class="panel"><h3>4. Causa raiz</h3><p class="hint">A pergunta mais importante do LNT: isso é problema de <b>saber</b>, de <b>poder</b> ou de <b>querer</b>?</p>'+
 '<div class="radiorow">'+
  '<label><input type="radio" name="causa" '+(l.causa=='sabe'?'checked':'')+' onchange="setLnt(\'causa\',\'sabe\')"> Não sabe (nunca ensinado)</label>'+
  '<label><input type="radio" name="causa" '+(l.causa=='consegue'?'checked':'')+' onchange="setLnt(\'causa\',\'consegue\')"> Não consegue (sem condição de aplicar)</label>'+

function exportJSON(){var b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="artblend_td_"+nomeClienteAtivo().replace(/[^a-z0-9]+/gi,'_')+".json";a.click();}

function isValidTDState(o){
  return !!(o && typeof o==='object' && o.lnt && typeof o.lnt==='object' && Array.isArray(o.planos) && Array.isArray(o.avaliacoes));
}
document.getElementById('fileIn').onchange=function(e){
  var f=e.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var novo=JSON.parse(rd.result);
      if(!isValidTDState(novo)){ alert('Arquivo inválido: não parece ser um export de dados de T&D (esperado lnt/planos/avaliacoes).'); return; }
      if(!confirm('Importar este arquivo vai substituir todos os dados do cliente ativo ("'+nomeClienteAtivo()+'"). Deseja continuar?')) return;
      S=novo;
      save();
      render(cur);
      alert('Importado com sucesso.');
    }catch(err){ alert('Arquivo inválido: ' + err.message); }
    e.target.value='';
  };
  rd.readAsText(f);
};
