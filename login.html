<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtBlend - Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #16A5A5 0%, #0F7D7D 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .login-container h1 {
            color: #16A5A5;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 800;
        }
        
        .login-container p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            color: #16A5A5;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #16A5A5;
        }
        
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #16A5A5, #0F7D7D);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(22, 165, 165, 0.4);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
                
                
                
                
                        
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
            display: block;
        }
        
        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
            display: block;
        }
        
        .back-link {
            margin-top: 20px;
        }
        
        .back-link a {
            color: #16A5A5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        
        .back-link a:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">🎯</div>
    <h1>ArtBlend</h1>
    <p>Acesse a plataforma de consultoria</p>
    
    <div id="message" class="message"></div>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="email"><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        
        <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Senha</label>
            <input type="password" id="password" placeholder="Sua senha" required>
        </div>
        
        <button type="submit" class="btn-login" id="btnLogin">
            <i class="fas fa-sign-in-alt"></i> FAZER LOGIN
        </button>
        <p style="text-align:center;margin-top:14px;">
            <a href="#" id="btnEsqueci" style="color:#16A5A5;font-weight:600;">Esqueci minha senha</a>
        </p>
    </form>

    <form id="novaSenhaForm" style="display:none;">
        <p style="text-align:center;margin-bottom:12px;"><strong>Crie sua nova senha</strong></p>
        <div class="form-group">
            <label for="novaSenha"><i class="fas fa-lock"></i> Nova senha</label>
            <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>
        <button type="submit" class="btn-login" id="btnNovaSenha">
            <i class="fas fa-save"></i> SALVAR NOVA SENHA
        </button>
    </form>
    
    <div class="back-link">
        <a href="inicio.html"><i class="fas fa-arrow-left"></i> Voltar</a>
    </div>
</div>

<script>
// Inicializar Supabase
const SUPABASE_URL = 'https://zjvjixiuvnpbpsdnxuyk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqdmppeGl1dm5wYnBzZG54dXlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNDUxMjMsImV4cCI6MjA5OTcyMTEyM30.TgC8A0y8e4Or4FZhSVglUW2micje9belaE0P-vAUwiY';

const { createClient } = window.supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

// Mostrar mensagem
function showMessage(msg, type) {
    const msgDiv = document.getElementById('message');
    msgDiv.textContent = msg;
    msgDiv.className = `message ${type}`;
    msgDiv.style.display = 'block';
}

// Esqueci minha senha: envia link de recuperação para o e-mail digitado
document.getElementById('btnEsqueci').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) {
        showMessage('Digite seu e-mail no campo acima e clique de novo.', 'error');
        return;
    }
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://artblendconsultoria.com.br/login'
    });
    if (error) {
        showMessage('Não foi possível enviar o e-mail: ' + error.message, 'error');
    } else {
        showMessage('Se o e-mail estiver cadastrado, você vai receber um link para criar a nova senha. Confira também a caixa de spam.', 'success');
    }
});

// Quando o usuário chega pelo link do e-mail, mostra o formulário de nova senha
supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('novaSenhaForm').style.display = 'block';
    }
});

document.getElementById('novaSenhaForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nova = document.getElementById('novaSenha').value;
    const btn = document.getElementById('btnNovaSenha');
    btn.disabled = true;
    const { error } = await supabase.auth.updateUser({ password: nova });
    if (error) {
        showMessage('Não foi possível salvar: ' + error.message, 'error');
        btn.disabled = false;
        return;
    }
    showMessage('Senha criada com sucesso! Entrando na plataforma...', 'success');
    setTimeout(() => { window.location.href = 'plataforma.html'; }, 1200);
});

// Fazer login
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btnLogin = document.getElementById('btnLogin');
    
    btnLogin.disabled = true;
    btnLogin.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Validando...';
    
    try {
        // Login real: valida e-mail e senha no Supabase Auth
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error || !data || !data.session) {
            showMessage('❌ E-mail ou senha incorretos!', 'error');
            btnLogin.disabled = false;
            btnLogin.innerHTML = '<i class="fas fa-sign-in-alt"></i> FAZER LOGIN';
            return;
        }

        showMessage('✅ Login realizado com sucesso!', 'success');
        setTimeout(() => { window.location.href = 'plataforma.html'; }, 800);
    } catch (error) {
        console.error('Erro:', error);
        showMessage('❌ Erro ao fazer login. Tente novamente.', 'error');
        btnLogin.disabled = false;
        btnLogin.innerHTML = '<i class="fas fa-sign-in-alt"></i> FAZER LOGIN';
    }
});
</script>

</body>
</html>
