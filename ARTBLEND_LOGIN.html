<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Plataforma ArtBlend - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            padding: 50px;
            text-align: center;
        }
        
        .login-header {
            margin-bottom: 40px;
        }
        
        .login-logo {
            font-size: 3em;
            margin-bottom: 15px;
        }
        
        .login-header h1 {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #999;
            font-size: 0.95em;
        }
        
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102,126,234,0.2);
        }
        
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102,126,234,0.3);
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9em;
            border-left: 4px solid #c62828;
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .login-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.85em;
            color: #999;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">🎯</div>
            <h1>ArtBlend</h1>
            <p>Plataforma Inteligente de Consultoria</p>
        </div>
        
        <div class="error-message" id="errorMsg"></div>
        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #667eea;">Autenticando...</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">📧 Email</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">🔐 Senha</label>
                <input type="password" id="password" placeholder="sua senha" required>
            </div>
            
            <button type="submit" class="btn-login">Entrar na Plataforma</button>
        </form>
        
        <div class="login-footer">
            <p>Use qualquer email/senha para teste</p>
            <a href="/" class="back-link">← Voltar ao site</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zjvjixiuvnpbpsdnxuyk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2aml4aXV2bnBicHNkbnh1eWsiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcxMDc0NjI5MSwiZXhwIjoxODM2MjIyMjkxfQ.L4e3B5F6XyZ9KmN2QpR8VwX5YaB3CdE7FgH9IjK0LmN';

        // Check se já está logado
        window.addEventListener('load', () => {
            const clienteId = localStorage.getItem('cliente_id');
            if (clienteId) {
                window.location.href = '/artblend_hub';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            const loadingDiv = document.getElementById('loadingSpinner');

            errorDiv.style.display = 'none';
            loadingDiv.style.display = 'block';

            try {
                // Criar cliente
                const clienteId = 'cliente_' + Date.now();
                localStorage.setItem('cliente_id', clienteId);
                localStorage.setItem('user_email', email);
                localStorage.setItem('user_nome', 'Usuário');
                
                console.log('✅ Login bem-sucedido:', clienteId);
                
                // Redirecionar após 1 segundo
                setTimeout(() => {
                    window.location.href = '/artblend_hub';
                }, 1000);
            } catch (err) {
                console.error('❌ Erro:', err);
                errorDiv.textContent = '❌ Erro na autenticação. Tente novamente.';
                errorDiv.style.display = 'block';
                loadingDiv.style.display = 'none';
            }
        });
    </script>
</body>
</html>
